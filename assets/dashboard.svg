<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="100%" role="img" aria-label="Journey dashboard: 61% overall" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
