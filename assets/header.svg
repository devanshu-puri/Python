<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img" aria-label="Python: From First Principles to AI Engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22c55e"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="12s" repeatCount="indefinite"/></linearGradient>
<clipPath id="c"><rect width="1000" height="260" rx="20"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect x="-400" width="1800" height="260" fill="url(#g)"/>
<path fill="#fff" fill-opacity=".12"><animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 190 Q250 140 500 190 T1000 190 V260 H0Z;M0 190 Q250 240 500 190 T1000 190 V260 H0Z;M0 190 Q250 140 500 190 T1000 190 V260 H0Z"/></path>
<path fill="#fff" fill-opacity=".10"><animate attributeName="d" dur="11s" repeatCount="indefinite" values="M0 215 Q250 255 500 215 T1000 215 V260 H0Z;M0 215 Q250 175 500 215 T1000 215 V260 H0Z;M0 215 Q250 255 500 215 T1000 215 V260 H0Z"/></path>
<g fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
<text x="500" y="105" font-size="44" font-weight="800" opacity="0">Python: First Principles → AI Engineering<animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/></text>
<text x="500" y="150" font-size="20" opacity="0">syntax → pattern → abstraction → software system → AI capability<animate attributeName="opacity" from="0" to=".92" begin=".6s" dur="1.2s" fill="freeze"/></text>
</g></g></svg>
