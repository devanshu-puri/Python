name: Update journey
on:
  push:
    paths: ["journey.json", "scripts/build_readme.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_readme.py
      - run: |
          git config user.name "journey-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: refresh journey dashboard" && git push)
